# Rust coverage gate. Lives here, in tarpaulin's own config, so the Rust
# half of the repo is gated by Rust tooling — `cargo tarpaulin` fails on its
# own, with no Node.js in the loop. The TypeScript half is gated the
# equivalent way, by thresholds in vitest.config.ts.
[default]
out = ["Html", "Json"]
output-dir = "target/tarpaulin"

# Line coverage only: tarpaulin does not report branch or function coverage
# in a form worth gating on.
fail-under = 60
