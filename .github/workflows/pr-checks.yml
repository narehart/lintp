name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.

  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install asdf
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1

      - name: Install dependencies
        # retried once: runner npm registry flakes (ECONNRESET) shouldn't fail PRs
        run: npm ci || npm ci

      - name: Lint commits
        run: npx commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install asdf
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1

      - name: Setup Wireit cache
        uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2

      - name: Install dependencies
        # retried once: runner npm registry flakes (ECONNRESET) shouldn't fail PRs
        run: npm ci || npm ci

      - name: Run format check
        run: npm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install asdf
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1

      - name: Setup Wireit cache
        uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2

      - name: Install dependencies
        # retried once: runner npm registry flakes (ECONNRESET) shouldn't fail PRs
        run: npm ci || npm ci

      - name: Run lint check
        run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install asdf
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1

      - name: Setup Wireit cache
        uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2

      - name: Install dependencies
        # retried once: runner npm registry flakes (ECONNRESET) shouldn't fail PRs
        run: npm ci || npm ci

      - name: Run type check
        run: npm run check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install asdf
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1

      - name: Setup Wireit cache
        uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2

      - name: Install dependencies
        # retried once: runner npm registry flakes (ECONNRESET) shouldn't fail PRs
        run: npm ci --prefer-offline --no-audit || npm ci --prefer-offline --no-audit

      - name: Run tests
        run: npm test

  # lintp is a filesystem tool shipped for macOS and Windows, so the suite has
  # to run there too: path separators, case-insensitive filesystems and
  # symlink semantics are exactly where this codebase breaks. asdf is a bash
  # tool and can't set the toolchain up on Windows, so these runners read the
  # pinned versions from .tool-versions directly.
  test-cross-platform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned toolchain versions
        id: versions
        shell: bash
        run: |
          echo "rust=$(awk '/^rust /{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".tool-versions"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.versions.outputs.rust }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit || npm ci --prefer-offline --no-audit

      - name: Run tests
        run: npm test

  # The coverage gates themselves live with each toolchain — thresholds in
  # vitest.config.ts, fail-under in tarpaulin.toml — so this job just runs
  # them and lets them fail on their own.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install asdf
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1

      - name: Setup Wireit cache
        uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-tarpaulin

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit || npm ci --prefer-offline --no-audit

      - name: Run coverage gates
        run: npm run coverage

  # rust-version in Cargo.toml is a promise to every `cargo install` user.
  # Building on the pinned toolchain alone never tests it, because that
  # toolchain is newer than the floor we advertise.
  #
  # Scoped to the lib and bin deliberately: dev-dependencies are never built
  # by someone installing or depending on the crate, so they cannot constrain
  # the MSRV. criterion 0.8 needs rustc 1.86 and only the benchmarks use it;
  # the toolchain contributors run is pinned separately in .tool-versions.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read declared MSRV
        id: msrv
        run: echo "version=$(awk -F'"' '/^rust-version/{print $2}' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build against the declared floor
        run: cargo check --locked

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".tool-versions"

      - name: Install cargo-audit
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit --deny warnings

      # Production deps only: a vulnerability in a build-time devDependency
      # never reaches anyone who installs lintp-cli.
      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=moderate

  # Duplicate-logic detection for both halves of the repo. Both checks gate.
  similarity:
    name: Similarity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install similarity analyzers
        run: cargo install similarity-rs similarity-ts --locked

      # The TypeScript half is clean at the tool's own default threshold.
      - name: Check TypeScript for duplicate logic
        run: similarity-ts --min-lines 5 --fail-on-duplicates src scripts

      # Runs similarity-rs at full sensitivity and fails on any pair that is
      # not in the reviewed baseline. Raising the threshold instead would not
      # work: two functions differing only in prefix/suffix score 91.78%, so a
      # gate set above the known pairs would wave real copy-paste through.
      - name: Check Rust for duplicate logic
        run: ./scripts/check-similarity.sh

  # The crate renders on docs.rs; a broken intra-doc link or a malformed doc
  # example only shows up there, after publish, unless it is checked here.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the API docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features

  file-structure:
    name: File Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".tool-versions"

      # Dogfood: lintp lints its own repo against lintp.yml. @latest is
      # deliberate — every release immediately checks itself here.
      - name: Lint file structure with lintp
        run: npx --yes lintp-cli@latest
